  <text x="424" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#EDF2F7">Full-stack applications above, custom x86-64 kernels below.</text>
  <text x="424" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" fill="#8A99AD">I build web and mobile software with Laravel, Flutter, Node.js, and Godot 4, and write</text>
