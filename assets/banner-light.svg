  <text x="600" y="158" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#0969DA" text-anchor="middle">x86-64 UEFI  /  Laravel &amp; Flutter  /  Linux &amp; Hardening  /  Philippines</text>
